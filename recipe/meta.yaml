{% set name = "google-cloud-storage-control" %}
{% set version = "1.8.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/google_cloud_storage_control-{{ version }}.tar.gz
  sha256: e77f1365667e9cf8b6fbb0fc0de725a6045ee4b42220c3e6f863adace6c4033f

build:
  number: 1
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<37]

requirements:
  host:
    - python
    - pip
    - wheel
    - setuptools
  run:
    - python
    - google-api-core >=1.34.1,<3.0.0,!=2.0.*,!=2.1.*,!=2.2.*,!=2.3.*,!=2.4.*,!=2.5.*,!=2.6.*,!=2.7.*,!=2.8.*,!=2.9.*,!=2.10.*
    - google-auth >=2.14.1,<3.0.0,!=2.24.0,!=2.25.0
    - grpcio >={{ libgrpc }}.0,<2.0.0
    - proto-plus >=1.22.3,<2.0.0
    - proto-plus >=1.25.0,<2.0.0  # [py>=313]
    - protobuf {{ libprotobuf }}
    - grpc-google-iam-v1 >=0.14.0,<1.0.0

test:
  source_files:
    - tests
  imports:
    - google
  # pip check omitted: PyPI google-cloud-storage-control {{ version }} requires protobuf <7.0 in
  # requires_dist, so pip check fails when the test env installs protobuf 7.x (PKG-15573).
  # Restore once upstream metadata allows it.
  # commands:
  #   - pip check
  commands:
    - pytest -v --asyncio-mode=auto tests
  requires:
    - pip
    - pytest
    - pytest-asyncio
    - mock
    - requests

about:
  home: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-storage-control
  summary: Google Cloud Storage Control API client library
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  description: |
    Storage Control API: Lets you perform metadata-specific, controlplane, and long-running operations apart from the Storage API.
    Separating these operations from the Storage API improves API standardization and lets you run faster releases.
  dev_url: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-storage-control
  doc_url: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-storage-control/docs

extra:
  recipe-maintainers:
    - ankitaluthra1
    - chandra-siri
  skip-lints:
    - cbc_dep_in_run_missing_from_host
    - missing_pip_check
